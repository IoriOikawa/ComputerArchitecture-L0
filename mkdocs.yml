site_name: ComputerArchitectureL0
site_url: https://drew-undergraduate-catalog.coursedog.com/courses/CSCI260
theme:
  name: material
  font:
    text: Lato
    code: Courier Prime

  icon:
   logo: octicons/cpu-24

  features:
    - navigation.footer

  palette: 
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark Mode
      primary: light green
      accent: pink

    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light Mode
      primary: green
      accent: pink

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - admonition

  # Code Blocks
  - pymdownx.snippets
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.details
  # Multi Code Tabs
  - pymdownx.tabbed:
      alternate_style: true

  # Flow Charts
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  


extra:
  social:
    - icon: simple/x
      link: https://x.com/Iori_Oikawa
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/fengkai-wang-224263141/

